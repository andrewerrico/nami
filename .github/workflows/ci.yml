name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # Integration tests run against a real Postgres rather than a mock, so a
      # migration that does not apply fails here instead of on the deployed
      # database. Matches the major version Supabase runs.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nami
          POSTGRES_PASSWORD: nami
          POSTGRES_DB: nami
        ports:
          - 5432:5432
        # The job starts as soon as the container does, which is before Postgres
        # accepts connections — it restarts itself once during first-run
        # initialisation. Without this the first test races that restart.
        options: >-
          --health-cmd "pg_isready -U nami -d nami"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the floor in package.json engines. Bump both together.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

      # TEST_DATABASE_URL is what un-skips the integration tests. It is
      # deliberately not DATABASE_URL: nothing in CI should be able to reach a
      # real database, and the tests refuse any non-loopback host anyway.
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://nami:nami@localhost:5432/nami

  # Builds the production image. Nothing here has a Discord token or a database,
  # so this proves the image *builds* — that the lockfile resolves, TypeScript
  # compiles, and the runtime stage has what it needs. It cannot prove the bot
  # connects; that is what running it does.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nami:ci
          # Reuses layers between runs so this stays well under a minute once
          # dependencies stop changing.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A built image that dies on startup is still broken. This runs the real
      # entry point with a deliberately invalid config and asserts it fails the
      # way it is designed to: a named variable, not a stack trace.
      - name: Image fails cleanly on bad config
        run: |
          output=$(docker run --rm \
            -e DISCORD_TOKEN=short \
            -e DISCORD_APPLICATION_ID=nope \
            -e DATABASE_URL=mysql://wrong \
            nami:ci 2>&1) && exit_code=0 || exit_code=$?

          echo "$output"
          test "$exit_code" -eq 1 || { echo "expected exit 1, got $exit_code"; exit 1; }
          grep -q "Invalid environment configuration" <<<"$output"
          grep -q "DISCORD_TOKEN" <<<"$output"
          grep -q "DISCORD_APPLICATION_ID" <<<"$output"
          grep -q "DATABASE_URL" <<<"$output"
          echo "OK: image refuses to start and names every bad variable"
