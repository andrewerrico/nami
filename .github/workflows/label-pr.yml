name: Label PR

# Applies a type label from the title prefix, so the type lives in filterable
# metadata (`is:pr label:feat`) and can never drift from the title.
# The PR template deliberately has no "type of change" section.

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: label-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    # A pull_request event from a fork gets a read-only token, so labelling
    # would fail. Skip rather than report a confusing red check.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const TYPES = ['feat', 'fix', 'chore', 'docs', 'test', 'refactor', 'perf'];

            const pr = context.payload.pull_request;
            // Matches `feat:`, `feat(scope):` and the breaking-change `feat!:`.
            const match = pr.title.match(/^([a-z]+)(\([^)]*\))?!?:/);
            const type = match && TYPES.includes(match[1]) ? match[1] : null;

            if (!type) {
              core.notice(
                `Title "${pr.title}" has no recognised type prefix ` +
                  `(${TYPES.join(', ')}), so no label was applied.`
              );
              return;
            }

            const current = pr.labels.map((l) => l.name);
            const issue = { ...context.repo, issue_number: pr.number };

            // An edited title can leave the previous type behind.
            for (const stale of current.filter((n) => TYPES.includes(n) && n !== type)) {
              await github.rest.issues.removeLabel({ ...issue, name: stale });
              core.info(`Removed stale label: ${stale}`);
            }

            if (current.includes(type)) {
              core.info(`Label already correct: ${type}`);
              return;
            }

            await github.rest.issues.addLabels({ ...issue, labels: [type] });
            core.info(`Applied label: ${type}`);
